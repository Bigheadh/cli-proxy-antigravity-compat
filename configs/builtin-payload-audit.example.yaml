# ==============================================================================
# CLIProxyAPI v8.1.2 (85225381) 内置请求规则 (requests.payload) 核查对照配置说明
# ==============================================================================
#
# 一、内置配置核查结论（为什么“优先核对现有配置”后仍需本独立插件补齐）：
#
# 1. 静态路径子集可用性：
#    在 CLIProxyAPI v8.1.2 (internal/runtime/executor/helps/payload_helpers.go) 中，
#    内置执行器里唯有 AntigravityExecutor 向 NewPayloadFinalizerWithSourceModels 传入
#    protocol = "antigravity" 且 root = "request"。
#    因此，若在 payload.filter 中显式填写 protocol: "antigravity"，可以对 request.* 下的
#    纯静态固定字段（例如 request.stream，即 AG-COMPAT-001）做删除，不会影响内置 Codex/Claude/Gemini API。
#
# 2. 内置规则无法独立满足全部核心约束的 4 个硬边界：
#    (a) 缺少显式 executor 选择器：models[].protocol 匹配的是目标协议字符串而非内置执行器身份；
#        一旦运维漏写 protocol 字段会退化为全渠道通配从而污染 Codex (gpt-6.2-sol / gpt-6.2-astra)，
#        且任何声明 executor_input_formats: ["antigravity"] 的第三方插件执行器也会同样命中该规则。
#    (b) 无法表达跨字段/条件清理：
#        - AG-COMPAT-002 仅当 Claude 5.5 同时存在对象型 responseSchema 时才允许删除 request.tools/toolConfig；
#        - AG-COMPAT-003 仅删除 functionResponse Part 同级签名而必须保留 functionCall Part 同级合法签名；
#        - AG-COMPAT-005 仅当 maxOutputTokens <= 0、null 或浮点数时才删除，正整数必须保留。
#        内置 payload.filter 一旦配置静态路径就会无条件误删正常请求参数！
#    (c) root 锁定在 "request" 内部：无法触及顶层 envelope 字段（如顶层 toolConfig）。
#    (d) 无脱敏诊断能力：对尚无明确 400 证据的字段或组合（如 Issue #7878 Claude thinking + temperature），
#        内置规则只能“全删”或“静默忽略”，无法实现“只输出脱敏诊断、绝不修改请求”。
#
# 二、如果您仅需临时应急清理纯静态字段（不安装插件时的最小安全子集参考）：
#     注意：每条 models 规则必须严格显式声明 protocol: "antigravity"！严禁省略 protocol！

requests:
  payload:
    filter:
      - models:
          - name: "*"
            protocol: "antigravity"
        params:
          # 对应 AG-COMPAT-001（纯静态残留字段）
          - "stream"
          # 对应 AG-COMPAT-006（Gemini 整包包裹时可能混入 request.* 的跨协议顶层键）
          - "service_tier"
          - "store"
          - "parallel_tool_calls"
          - "stream_options"
          # 对应 AG-COMPAT-005 中 generationConfig 下的纯跨协议静态键（切勿将 maxOutputTokens 填入此处，否则会误删合法正整数！）
          - "generationConfig.service_tier"
          - "generationConfig.store"
          - "generationConfig.parallel_tool_calls"
          - "generationConfig.stream_options"
          - "generationConfig.reasoning_effort"
          - "generationConfig.max_tokens"
          - "generationConfig.max_completion_tokens"
